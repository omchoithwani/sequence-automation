# fly.toml — Fly.io deployment configuration
# Free tier: 3 shared-CPU VMs + 3 GB persistent volumes
#
# 1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
# 2. fly auth login
# 3. fly launch --no-deploy   (answer prompts, use existing fly.toml)
# 4. fly volumes create data --size 1   (persistent SQLite storage)
# 5. fly secrets set HUBSPOT_CLIENT_ID=… HUBSPOT_CLIENT_SECRET=… (etc.)
# 6. fly deploy

app = "sequence-automation"       # change to your unique app name
primary_region = "iad"

[build]

[env]
  PORT = "3000"

[mounts]
  source      = "data"
  destination = "/app/data"

[[services]]
  protocol      = "tcp"
  internal_port = 3000

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port        = 80
    handlers    = ["http"]
    force_https = true

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20
